<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace Portal</title>
    <style>
      /* Minimal reset and mobile-friendly base */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 16px;
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
      }
      header {
        padding: 1rem;
        border-bottom: 1px solid #2d3748;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      header h1 {
        font-size: 1rem;
        font-weight: 600;
      }
      header span {
        font-size: 0.8rem;
        color: #718096;
        font-family: monospace;
      }
      main {
        padding: 1rem;
        max-width: 900px;
        margin: 0 auto;
      }
      h2 {
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #718096;
        margin: 1.5rem 0 0.5rem;
      }
      /* Show spinner text on in-flight session start requests */
      button.htmx-request {
        opacity: 0.6;
        cursor: wait;
      }
      button.htmx-request::after {
        content: "…";
      }
      /* Tree */
      .tree {
        list-style: none;
      }
      .tree-item {
        border-bottom: 1px solid #1a202c;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.25rem;
        cursor: pointer;
        user-select: none;
      }
      .tree-row:hover {
        background: #1a202c;
      }
      .tree-indent {
        padding-left: 1.25rem;
      }
      .tree-icon {
        width: 1rem;
        text-align: center;
        font-size: 0.75rem;
        color: #718096;
      }
      .tree-name {
        flex: 1;
        font-size: 0.875rem;
        font-family: monospace;
      }
      .tree-name.git::after {
        content: " git";
        font-size: 0.7rem;
        color: #48bb78;
        background: #1a3329;
        padding: 0 0.25rem;
        border-radius: 3px;
        margin-left: 0.25rem;
      }
      .tree-actions {
        display: flex;
        gap: 0.25rem;
      }
      /* Buttons */
      .btn {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      /* Larger tap targets on touch devices */
      @media (pointer: coarse) {
        .btn {
          padding: 0.5rem 0.75rem;
          min-width: 44px;
          min-height: 44px;
        }
      }
      .btn-action {
        width: 1.8rem;
        height: 1.8rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.2);
        position: relative;
      }
      .btn-action img {
        width: 1rem;
        height: 1rem;
        display: block;
      }
      .btn-action:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .btn-stop-group {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.35);
        list-style: none;
        width: 1.8rem;
        height: 1.8rem;
        padding: 0;
      }
      .btn-stop-group:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .btn-stop-group img {
        width: 0.95rem;
        height: 0.95rem;
        display: block;
      }
      .btn-loading {
        opacity: 0.7;
        cursor: wait;
      }
      .btn-loading img {
        opacity: 0.35;
      }
      .spinner {
        width: 0.6rem;
        height: 0.6rem;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: spin-centered 0.8s linear infinite;
      }
      @keyframes spin-centered {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* Sessions */
      #sessions {
        margin: 0.5rem 0 1rem;
      }
      .session-group {
        border-bottom: 1px solid #1a202c;
        padding: 0.5rem 0;
      }
      .session-group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .session-group-dir {
        flex: 1;
        min-width: 0;
        font-family: monospace;
        color: #a0aec0;
        font-size: 0.875rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-group-actions {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        flex-shrink: 0;
      }
      .stop-menu {
        position: relative;
      }
      .stop-menu > summary {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .stop-menu > summary::-webkit-details-marker {
        display: none;
      }
      .stop-menu-items {
        position: absolute;
        right: 0;
        top: calc(100% + 0.25rem);
        background: #111827;
        border: 1px solid #2d3748;
        border-radius: 6px;
        min-width: 9.5rem;
        z-index: 5;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        padding: 0.25rem;
      }
      .stop-menu-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.35rem 0.45rem;
        min-height: 2rem;
        border: 0;
        background: transparent;
        color: #e2e8f0;
        border-radius: 4px;
        cursor: pointer;
      }
      .stop-menu-item:hover {
        background: #1f2937;
      }
      /* Loading indicator (shown while htmx request in flight) */
      .htmx-indicator {
        display: none;
      }
      .htmx-request .htmx-indicator {
        display: inline;
      }
      .htmx-request.htmx-indicator {
        display: inline;
      }
      /* Children container */
      .children {
        display: none;
      }
      .children.open {
        display: block;
      }
      /* Error banner inside the sessions area */
      .sessions-error {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        background: #3b1515;
        border: 1px solid #742a2a;
        font-size: 0.8rem;
        color: #fc8181;
        margin-top: 0.25rem;
      }
      .sessions-error-msg {
        flex: 1;
        font-family: monospace;
        word-break: break-all;
      }
      /* Root row */
      .root-row .tree-name {
        font-weight: 600;
        color: #e2e8f0;
      }
      .root-row {
        border-bottom: 2px solid #2d3748;
      }

      @media (max-width: 640px) {
        .tree-row,
        .session-group-head {
          gap: 0.35rem;
        }
        .tree-name,
        .session-group-dir {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .btn-action {
          width: 2.75rem;
          height: 2.75rem;
        }
        .btn-stop-group {
          width: 2.75rem;
          height: 2.75rem;
        }
        .btn-action img,
        .btn-stop-group img {
          width: 1.1rem;
          height: 1.1rem;
        }
        .stop-menu-item {
          padding: 0.6rem 0.7rem;
          min-height: 2.75rem;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body hx-ext="sse" sse-connect="/events">
    <header>
      <h1>Workspace Portal</h1>
      <span>{{.Root}}</span>
    </header>

    <main>
      <h2>Running Sessions</h2>
      <span id="sessions-indicator" class="htmx-indicator" style="font-size:0.75rem; color:#718096; margin-bottom:0.25rem; display:none">Loading...</span>
      <div
        id="sessions"
        hx-get="/sessions"
        hx-trigger="sse:session.started, sse:session.stopped, sse:session.healthy"
        hx-swap="innerHTML"
      >
        {{template "sessions.html" .Sessions}}
      </div>

      <h2>Directories</h2>
      <ul class="tree" id="tree-root">
        <li class="tree-item root-row" id="item-root">
          <div class="tree-row">
            <span class="tree-icon" style="color: #2d3748">—</span>
            <span class="tree-name{{if .RootRow.IsGit}} git{{end}}">{{.RootRow.Name}}</span>
             <div class="tree-actions">
               {{range .RootRow.Actions}}
               <button
                 class="btn btn-action btn-{{.Type}}"
                 hx-post="/sessions/start"
                 hx-vals='{"type":"{{.Type}}","dir":"{{$.RootRow.Path}}"}'
                 hx-target="#sessions"
                 hx-swap="innerHTML"
                 hx-indicator="#sessions-indicator"
                 title="{{.Label}}"
                 aria-label="{{.Label}}"
               >
                 <img src="/static/{{.Icon}}" alt="" aria-hidden="true" />
               </button>
               {{end}}
             </div>
           </div>
         </li>
         {{template "tree-children.html" .RootEntries}}
      </ul>
    </main>

    <script src="/static/htmx-2.0.8.min.js"></script>
    <script src="/static/htmx-ext-sse.min.js"></script>
    <script>
      function toggleChildren(icon, id) {
        const children = document.getElementById("children-" + id);
        if (!children) return;

        const isOpen = children.classList.toggle("open");
        icon.textContent = isOpen ? "▼" : "▶";
      }
    </script>
  </body>
</html>
